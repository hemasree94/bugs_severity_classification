global:
  scrape_interval: 15s        # scrape every 15 seconds
  evaluation_interval: 15s    # evaluate alert rules every 15 seconds

# Link to alerting rules file
rule_files:
  - "alert_rules.yml"

# Send alerts to AlertManager
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "localhost:9093"

scrape_configs:

  # 1. Your FastAPI bugs app
  - job_name: "bugs_app"
    static_configs:
      - targets: ["localhost:8000"]   # your FastAPI runs here
    metrics_path: /metrics

  # 2. Node Exporter (system metrics: CPU, RAM, Disk)
  - job_name: "node_exporter"
    static_configs:
      - targets: ["localhost:9100"]   # node_exporter default port