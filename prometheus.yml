global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"   # service name in Docker

scrape_configs:

  # FastAPI bugs app — use Docker service name
  - job_name: "bugs_app"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  # Node Exporter — use Docker service name
  - job_name: "node_exporter"
    static_configs:
      - targets: ["node-exporter:9100"]