global:
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: "your-gmail@gmail.com"          # sender Gmail address
  smtp_auth_username: "your-gmail@gmail.com" # same Gmail address
  smtp_auth_password: "xxxx xxxx xxxx xxxx"  # Gmail App Password (NOT your login password)
  smtp_require_tls: true

# --- ROUTING ---
route:
  receiver: "email-alerts"
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h

  routes:
    - match:
        severity: critical
      receiver: "email-alerts"
      repeat_interval: 30m

    - match:
        severity: warning
      receiver: "email-alerts"
      repeat_interval: 1h

    - match:
        severity: info
      receiver: "email-alerts"
      repeat_interval: 6h

# --- RECEIVERS ---
receivers:
  - name: "email-alerts"
    email_configs:
      - to: "your-gmail@gmail.com"           # receiver inbox (can be same or different)
        subject: "[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}"
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          Fired at: {{ .StartsAt }}
          {{ end }}

# --- INHIBITION ---
inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname"]